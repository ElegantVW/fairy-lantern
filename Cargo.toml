[package]
name = "fairy-lantern"
version = "0.10.0"
edition = "2021"
description = "faeOS Fairy Lantern — GBA emulator from scratch (no foreign cores)"
license = "MIT"
publish = false

[[bin]]
name = "fairy-lantern"
path = "src/main.rs"

[[bin]]
name = "fairy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
minifb = "0.27"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
dead_code = "allow"
unused_mut = "allow"
unused_variables = "allow"

[lints.clippy]
manual_is_multiple_of = "allow"
manual_range_contains = "allow"
needless_range_loop = "allow"
manual_range_patterns = "allow"
too_many_arguments = "allow"
unusual_byte_groupings = "allow"
identity_op = "allow"
derivable_impls = "allow"
implicit_saturating_sub = "allow"
field_reassign_with_default = "allow"
unnecessary_cast = "allow"
collapsible_if = "allow"
match_single_binding = "allow"
same_item_push = "allow"
ptr_arg = "allow"
needless_ifs = "allow"
double_parens = "allow"
