[package]
name = "fairy-lantern"
version = "0.1.0"
edition = "2021"
description = "faeOS Fairy Lantern — GBA emulator from scratch (no foreign cores)"
license = "MIT"
publish = false

[[bin]]
name = "fairy-lantern"
path = "src/main.rs"

[[bin]]
name = "fairy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
minifb = "0.27"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
